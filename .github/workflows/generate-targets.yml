name: Generate targets

on:
  push:
    branches: [main]
    paths:
      - "crawl_3oaks.py"
      - ".github/workflows/generate-targets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Generate current targets
        run: python crawl_3oaks.py --output .crawler-test-output
      - name: Validate targets
        shell: python
        run: |
          import json
          from pathlib import Path

          catalog = json.loads(Path(".crawler-test-output/catalog.json").read_text(encoding="utf-8"))
          targets = [line.strip() for line in Path("targets.txt").read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(targets) == len(catalog), (len(targets), len(catalog))
          assert len(targets) >= 100, len(targets)
          assert len(targets) == len(set(targets)), "targets duplicados"
          assert all(url.startswith("https://3oaks.com/api/v1/games/") and url.endswith("/play?lang=en") for url in targets)
          print(f"VALIDATED targets={len(targets)}")
      - name: Commit targets.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets.txt
          git diff --cached --quiet || git commit -m "data: update 3 Oaks targets"
          git push
